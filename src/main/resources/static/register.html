<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | CampusConnect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            🎓 CampusConnect
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#jobs">Jobs</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="#">Applications</a></li>
        </ul>

    </header>


    <!-- Registration Section -->
    <section class="register-section">

        <div class="register-container">

            <div class="register-header">

                <div class="register-icon">
                    🎓
                </div>

                <h1>Create Your Student Profile</h1>

                <p>
                    Register with CampusConnect and start exploring
                    career opportunities.
                </p>

            </div>


            <form id="registrationForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>

				<!-- Password -->
				<div class="form-group">

				    <label for="password">
				        Password
				    </label>

				    <input
				        type="password"
				        id="password"
				        name="password"
				        placeholder="Create a password"
				        required
				    >

				</div>

                <!-- Phone -->
                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="10-digit phone number"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- Department -->
                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select id="department" name="department" required>

                        <option value="">
                            Select your department
                        </option>

                        <option value="CSE">
                            Computer Science & Engineering
                        </option>

                        <option value="ECE">
                            Electronics & Communication Engineering
                        </option>

                        <option value="EEE">
                            Electrical & Electronics Engineering
                        </option>

                        <option value="MECH">
                            Mechanical Engineering
                        </option>

                        <option value="CIVIL">
                            Civil Engineering
                        </option>

                        <option value="IT">
                            Information Technology
                        </option>

                    </select>

                </div>


                <!-- Graduation Year -->
                <div class="form-group">

                    <label for="graduationYear">
                        Graduation Year
                    </label>

                    <input
                        type="number"
                        id="graduationYear"
                        name="graduationYear"
                        placeholder="Example: 2026"
                        min="2000"
                        max="2100"
                        required
                    >

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Student Profile
                </button>

            </form>


            <p class="login-text">
                Already registered?
                <a href="index.html">Go to CampusConnect</a>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 CampusConnect. All Rights Reserved.
        </p>

    </footer>

	<script src="script.js?v=2"></script>
</body>

</html>
